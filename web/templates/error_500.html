<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - NetworkDisk</title>
    <style>
        :root {
            --bg: #f5f5f5;
            --text: #1a1a1a;
            --text-secondary: #666666;
            --primary: #2563eb;
            --surface: #ffffff;
            --border: #e0e0e0;
            --danger: #dc2626;
        }
        [data-theme="dark"] {
            --bg: #0f172a;
            --text: #e2e8f0;
            --text-secondary: #94a3b8;
            --surface: #1e293b;
            --border: #334155;
            --danger: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .error-container {
            text-align: center;
            padding: 48px;
        }
        .error-code {
            font-size: 96px;
            font-weight: 700;
            color: var(--danger);
            line-height: 1;
            margin-bottom: 16px;
        }
        .error-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .error-description {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 32px;
        }
        .btn {
            display: inline-block;
            padding: 10px 24px;
            background: var(--primary);
            color: #ffffff;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">500</div>
        <div class="error-title">服务器内部错误</div>
        <div class="error-description">服务器遇到了意外错误，请稍后重试</div>
        <a href="/" class="btn">返回首页</a>
    </div>
    <script>
        (function() {
            var stored = localStorage.getItem('theme');
            if (stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
</body>
</html>
