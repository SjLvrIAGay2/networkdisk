<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - NetworkDisk</title>
    <style>
        :root {
            --bg: #f5f5f5;
            --surface: #ffffff;
            --text: #1a1a1a;
            --text-secondary: #666666;
            --border: #e0e0e0;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #dc2626;
        }
        [data-theme="dark"] {
            --bg: #0f172a;
            --surface: #1e293b;
            --text: #e2e8f0;
            --text-secondary: #94a3b8;
            --border: #334155;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
        }
        .header-brand {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary);
            text-decoration: none;
        }
        .theme-toggle {
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: none;
            color: var(--text);
            font-size: 16px;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 24px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text);
        }
        .form-group input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            background: var(--bg);
            color: var(--text);
            max-width: 360px;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }
        .btn {
            display: inline-block;
            padding: 8px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
        }
        .btn-primary {
            background: var(--primary);
            color: #ffffff;
        }
        .btn-primary:hover {
            background: var(--primary-hover);
        }
        .error-message {
            color: var(--danger);
            font-size: 14px;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="/" class="header-brand">NetworkDisk</a>
        <button id="themeToggle" class="theme-toggle" type="button" onclick="toggleTheme()">🌙</button>
    </div>
    <div class="card" style="max-width:400px;margin:40px auto;">
        <h2 style="margin-bottom:20px;">登录</h2>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary">登录</button>
            <div id="loginError" class="error-message"></div>
        </form>
        <p style="margin-top:16px;font-size:14px;color:var(--text-secondary);">
            还没有账号？<a href="/register" style="color:var(--primary);">注册</a>
        </p>
    </div>
    <script>
        (function() {
            var stored = localStorage.getItem('theme');
            if (stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.setAttribute('data-theme', 'dark');
                var btn = document.getElementById('themeToggle');
                if (btn) btn.textContent = '☀️';
            }
        })();
        function toggleTheme() {
            var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (isDark) {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
                var btn = document.getElementById('themeToggle');
                if (btn) btn.textContent = '🌙';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                var btn = document.getElementById('themeToggle');
                if (btn) btn.textContent = '☀️';
            }
        }
        function getCSRFToken() {
            var match = document.cookie.match(/(?:^|;\s*)csrf_token=([^;]*)/);
            return match ? match[1] : '';
        }
        async function handleLogin(e) {
            e.preventDefault();
            var errorEl = document.getElementById('loginError');
            errorEl.textContent = '';
            var body = JSON.stringify({
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            });
            try {
                var resp = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-Token': getCSRFToken()
                    },
                    body: body
                });
                var data = await resp.json();
                if (!resp.ok) {
                    errorEl.textContent = data.error || '登录失败';
                    return;
                }
                localStorage.setItem('access_token', data.access_token);
                window.location.href = '/';
            } catch (err) {
                errorEl.textContent = '网络错误';
            }
        }
    </script>
</body>
</html>
