{{template "base.html" .}}
{{define "title"}}文件 - NetworkDisk{{end}}
{{define "nav-right"}}
<span id="navUsername" style="font-size:14px;color:var(--text-secondary);"></span>
<button onclick="handleLogout()" style="font-size:14px;color:var(--text);text-decoration:none;background:none;border:none;cursor:pointer;padding:6px 12px;border-radius:6px;">退出</button>
<button id="themeToggle" class="theme-toggle" onclick="toggleTheme()">🌙</button>
{{end}}
{{define "sidebar"}}{{end}}
{{define "content"}}
<div>
    <div class="category-bar">
        <button class="category-tab active" data-category="all" onclick="switchCategory('all')">全部</button>
        <button class="category-tab" data-category="recent" onclick="switchCategory('recent')">最近</button>
        <button class="category-tab" data-category="document" onclick="switchCategory('document')">文档</button>
        <button class="category-tab" data-category="image" onclick="switchCategory('image')">图片</button>
        <button class="category-tab" data-category="video" onclick="switchCategory('video')">视频</button>
        <button class="category-tab" data-category="shared" onclick="switchCategory('shared')">我的分享</button>
        <button class="category-tab" data-category="recycle" onclick="switchCategory('recycle')">回收站</button>
    </div>
    <div class="toolbar" style="margin-bottom:16px;display:flex;align-items:center;gap:12px;">
        <span id="toolbarDirActions">
            <button class="btn btn-primary" onclick="showMkdirModal()">新建文件夹</button>
            <label class="btn" style="cursor:pointer;background:var(--primary);color:#fff;padding:8px 20px;border-radius:6px;font-size:14px;">
                上传文件
                <input type="file" id="fileInput" style="display:none" onchange="handleUpload(this)">
            </label>
        </span>
        <button class="btn" style="background:var(--surface);border:1px solid var(--border);" onclick="refreshFiles()">刷新</button>
    </div>
    <div id="breadcrumb" style="margin-bottom:12px;font-size:13px;color:var(--text-secondary);">
        <a href="#" onclick="navigateTo(null);return false;" style="color:var(--primary);text-decoration:none;">根目录</a>
    </div>
    <div class="card" style="padding:0;">
        <div class="file-list-header">
            <span class="col-name">名称</span>
            <span class="col-actions"></span>
            <span class="col-size">大小</span>
            <span class="col-time" id="colTime">创建时间</span>
        </div>
        <div id="fileList">
            <div class="loading">加载中...</div>
        </div>
    </div>
</div>

<div id="mkdirModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);z-index:200;align-items:center;justify-content:center;">
    <div style="background:var(--surface);border-radius:8px;padding:24px;min-width:320px;">
        <h3 style="margin-bottom:16px;">新建文件夹</h3>
        <div class="form-group">
            <input type="text" id="dirNameInput" placeholder="文件夹名称" style="max-width:100%;">
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end;">
            <button class="btn" style="background:var(--border);" onclick="hideMkdirModal()">取消</button>
            <button class="btn btn-primary" onclick="createDir()">创建</button>
        </div>
    </div>
</div>

<div id="renameModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);z-index:200;align-items:center;justify-content:center;">
    <div style="background:var(--surface);border-radius:8px;padding:24px;min-width:320px;">
        <h3 style="margin-bottom:16px;">重命名</h3>
        <div class="form-group">
            <input type="text" id="renameInput" placeholder="新名称" style="max-width:100%;">
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end;">
            <button class="btn" style="background:var(--border);" onclick="hideRenameModal()">取消</button>
            <button class="btn btn-primary" onclick="doRename()">确认</button>
        </div>
    </div>
</div>

<div id="createShareModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);z-index:200;align-items:center;justify-content:center;">
    <div style="background:var(--surface);border-radius:8px;padding:24px;min-width:360px;">
        <h3 style="margin-bottom:16px;">创建分享</h3>
        <div class="form-group">
            <label>密码 (可选)</label>
            <input type="text" id="sharePassword" placeholder="留空则不设密码" style="max-width:100%;">
        </div>
        <div class="form-group">
            <label>有效期</label>
            <select id="shareExpire" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);">
                <option value="0">永久</option>
                <option value="1">1天</option>
                <option value="7">7天</option>
                <option value="30">30天</option>
                <option value="90">90天</option>
            </select>
        </div>
        <div class="form-group">
            <label>下载次数限制 (0=不限)</label>
            <input type="number" id="shareMaxDownloads" value="0" min="0" style="max-width:100%;">
        </div>
        <div id="shareError" class="error-message" style="display:none;margin-bottom:8px;"></div>
        <div style="display:flex;gap:8px;justify-content:flex-end;">
            <button class="btn" style="background:var(--border);" onclick="hideCreateShareModal()">取消</button>
            <button class="btn btn-primary" onclick="doCreateShare()">创建</button>
        </div>
    </div>
</div>
{{end}}
{{define "scripts"}}
<script>
var currentDir = null;
var currentCategory = 'all';
var renameFileId = null;
var shareFileId = null;

(function() {
    var token = localStorage.getItem('access_token');
    if (!token) {
        window.location.replace('/login');
        return;
    }
    apiFetch('/api/auth/me', {}).then(function(r) {
        if (!r.ok) {
            localStorage.removeItem('access_token');
            window.location.replace('/login');
            return;
        }
        return r.json();
    }).then(function(data) {
        if (data && data.username) {
            var el = document.getElementById('navUsername');
            if (el) el.textContent = data.username;
        }
    }).catch(function() {
        localStorage.removeItem('access_token');
        window.location.replace('/login');
    });
    switchCategory('all');
})();

function navigateTo(dirId) {
    currentDir = dirId;
    refreshFiles();
}

function switchCategory(category) {
    currentCategory = category;
    document.querySelectorAll('.category-tab').forEach(function(t) {
        t.classList.toggle('active', t.dataset.category === category);
    });
    var breadcrumb = document.getElementById('breadcrumb');
    var toolbarDir = document.getElementById('toolbarDirActions');
    if (category === 'all') {
        breadcrumb.style.display = 'block';
        toolbarDir.style.display = 'inline';
    } else {
        breadcrumb.style.display = 'none';
        toolbarDir.style.display = 'none';
    }
    document.getElementById('colTime').textContent = (category === 'recycle') ? '删除时间' : '创建时间';
    if (category !== 'all') {
        currentDir = null;
    }
    refreshFiles();
}

function refreshFiles() {
    var url;
    switch (currentCategory) {
        case 'all':
            url = '/api/files';
            if (currentDir !== null) url += '?dir_id=' + currentDir;
            break;
        case 'recent':
            url = '/api/files/recent?limit=100';
            break;
        case 'document':
        case 'image':
        case 'video':
            url = '/api/files?type=' + currentCategory;
            break;
        case 'shared':
            url = '/api/files/shared';
            break;
        case 'recycle':
            url = '/api/files/recycle';
            break;
        default:
            url = '/api/files';
    }
    apiFetch(url, {}).then(function(r) {
        if (!r.ok) throw new Error('failed');
        return r.json();
    }).then(function(data) {
        renderFiles(data.files);
    }).catch(function() {
        document.getElementById('fileList').innerHTML = '<div class="error-state">加载失败</div>';
    });
}

function renderFiles(files) {
    var container = document.getElementById('fileList');
    if (!files || files.length === 0) {
        var emptyMsg = '暂无文件';
        if (currentCategory === 'all') emptyMsg = '空目录';
        else if (currentCategory === 'recent') emptyMsg = '暂无最近文件';
        else if (currentCategory === 'shared') emptyMsg = '暂无分享';
        else if (currentCategory === 'recycle') emptyMsg = '回收站为空';
        container.innerHTML = '<div class="empty-state">' + emptyMsg + '</div>';
        return;
    }
    var isRecycle = (currentCategory === 'recycle');
    var isAll = (currentCategory === 'all');
    var html = '';
    for (var i = 0; i < files.length; i++) {
        var f = files[i];
        var icon = f.is_dir ? '📁' : '📄';
        var nameDisplay = escapeHtml(f.name);
        var sizeStr = f.is_dir ? '-' : formatSize(f.size);
        var ts = isRecycle ? (f.deleted_at || '') : (f.created_at || '');
        var timeStr = ts.substring(0, 10);

        var nameHtml;
        if (f.is_dir && isAll) {
            nameHtml = '<a href="#" onclick="navigateTo(' + f.id + ');return false;" style="color:var(--text);text-decoration:none;">' + icon + ' ' + nameDisplay + '</a>';
        } else {
            nameHtml = icon + ' ' + nameDisplay;
        }

        html += '<div class="file-row" data-file-id="' + f.id + '">';
        html += '<div class="file-name">' + nameHtml + '</div>';
        html += '<div class="file-actions">';
        if (isRecycle) {
            html += '<button class="action-btn action-restore" onclick="restoreFile(' + f.id + ')">恢复</button>';
            html += '<button class="action-btn action-delperm" onclick="permanentDelete(' + f.id + ',' + (f.is_dir ? 'true' : 'false') + ')">永久删除</button>';
        } else {
            if (!f.is_dir) {
                html += '<button class="action-btn" style="border-color:var(--primary);color:var(--primary);" onclick="showCreateShareModal(' + f.id + ')">分享</button>';
                html += '<button class="action-btn" onclick="downloadFile(' + f.id + ',\'' + escapeJsAttr(f.name) + '\')">下载</button>';
            }
            html += '<button class="action-btn" style="border-color:var(--danger);color:var(--danger);" onclick="deleteFile(' + f.id + ')">删除</button>';
            html += '<button class="action-btn action-more">更多</button>';
        }
        html += '</div>';
        html += '<div class="file-size-cell">' + sizeStr + '</div>';
        html += '<div class="file-time-cell">' + timeStr + '</div>';
        html += '</div>';
    }
    container.innerHTML = html;
}

function showMkdirModal() {
    document.getElementById('mkdirModal').style.display = 'flex';
    document.getElementById('dirNameInput').value = '';
    document.getElementById('dirNameInput').focus();
}

function hideMkdirModal() {
    document.getElementById('mkdirModal').style.display = 'none';
}

function showRenameModal(id, name) {
    renameFileId = id;
    document.getElementById('renameModal').style.display = 'flex';
    document.getElementById('renameInput').value = name;
    document.getElementById('renameInput').focus();
}

function hideRenameModal() {
    document.getElementById('renameModal').style.display = 'none';
    renameFileId = null;
}

function createDir() {
    var name = document.getElementById('dirNameInput').value.trim();
    if (!name) return;
    apiFetch('/api/files/mkdir', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRF-Token': getCSRFToken()
        },
        body: JSON.stringify({ name: name, parent_id: currentDir })
    }).then(function(r) {
        if (r.ok) {
            hideMkdirModal();
            refreshFiles();
        } else {
            r.json().then(function(d) { alert(d.error || '创建失败'); });
        }
    }).catch(function() { alert('创建失败'); });
}

function doRename() {
    var name = document.getElementById('renameInput').value.trim();
    if (!name || !renameFileId) return;
    apiFetch('/api/files/' + renameFileId, {
        method: 'PATCH',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRF-Token': getCSRFToken()
        },
        body: JSON.stringify({ name: name })
    }).then(function(r) {
        if (r.ok) {
            hideRenameModal();
            refreshFiles();
        } else {
            r.json().then(function(d) { alert(d.error || '重命名失败'); });
        }
    }).catch(function() { alert('重命名失败'); });
}

function deleteFile(id) {
    if (!confirm('确认删除？文件将移至回收站。')) return;
    apiFetch('/api/files/' + id, {
        method: 'DELETE',
        headers: { 'X-CSRF-Token': getCSRFToken() }
    }).then(function(r) {
        if (r.ok) { refreshFiles(); }
        else { r.json().then(function(d) { alert(d.error || '删除失败'); }); }
    }).catch(function() { alert('删除失败'); });
}

function restoreFile(id) {
    apiFetch('/api/files/' + id + '/restore', {
        method: 'POST',
        headers: { 'X-CSRF-Token': getCSRFToken() }
    }).then(function(r) {
        if (r.ok) { refreshFiles(); }
        else { r.json().then(function(d) { alert(d.error || '恢复失败'); }); }
    }).catch(function() { alert('恢复失败'); });
}

function permanentDelete(id, isDir) {
    if (!isDir) {
        if (!confirm('确认永久删除？此操作不可撤销！')) return;
        doPermanentDelete(id);
        return;
    }
    apiFetch('/api/files/permanent-preview/' + id, {}).then(function(r) {
        if (!r.ok) throw new Error('preview failed');
        return r.json();
    }).then(function(data) {
        var msg = '确认永久删除？';
        var parts = [];
        if (data.dir_count > 0) parts.push(data.dir_count + '个文件夹');
        if (data.file_count > 0) parts.push(data.file_count + '个文件');
        if (parts.length > 0) msg += '此操作还会使该文件夹中' + parts.join('、') + '被永久删除。';
        else msg += '此操作不可撤销！';
        if (confirm(msg)) doPermanentDelete(id);
    }).catch(function() { alert('获取删除预览失败'); });
}

function doPermanentDelete(id) {
    apiFetch('/api/files/' + id + '/permanent', {
        method: 'DELETE',
        headers: { 'X-CSRF-Token': getCSRFToken() }
    }).then(function(r) {
        if (r.ok) { refreshFiles(); }
        else { r.json().then(function(d) { alert(d.error || '删除失败'); }); }
    }).catch(function() { alert('删除失败'); });
}

function showCreateShareModal(fileId) {
    shareFileId = fileId;
    document.getElementById('createShareModal').style.display = 'flex';
    document.getElementById('sharePassword').value = '';
    document.getElementById('shareExpire').value = '0';
    document.getElementById('shareMaxDownloads').value = '0';
    document.getElementById('shareError').style.display = 'none';
}

function hideCreateShareModal() {
    document.getElementById('createShareModal').style.display = 'none';
    shareFileId = null;
}

function doCreateShare() {
    if (!shareFileId) return;
    var password = document.getElementById('sharePassword').value.trim();
    var expireDays = parseInt(document.getElementById('shareExpire').value) || 0;
    var maxDownloads = parseInt(document.getElementById('shareMaxDownloads').value) || 0;
    var errEl = document.getElementById('shareError');
    apiFetch('/api/shares', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRF-Token': getCSRFToken()
        },
        body: JSON.stringify({
            file_id: shareFileId,
            password: password,
            expire_days: expireDays,
            max_downloads: maxDownloads
        })
    }).then(function(r) {
        if (r.ok) {
            hideCreateShareModal();
        } else {
            return r.json().then(function(d) { throw new Error(d.error || '创建失败'); });
        }
    }).catch(function(e) {
        errEl.textContent = e.message || '创建失败';
        errEl.style.display = 'block';
    });
}

function handleUpload(input) {
    var file = input.files[0];
    if (!file) return;
    var form = new FormData();
    form.append('file', file);
    if (currentDir !== null) form.append('dir_id', currentDir);
    apiFetch('/api/files/upload', {
        method: 'POST',
        headers: { 'X-CSRF-Token': getCSRFToken() },
        body: form
    }).then(function(r) {
        if (r.ok) { refreshFiles(); }
        else { r.json().then(function(d) { alert(d.error || '上传失败'); }); }
    }).catch(function() { alert('上传失败'); });
    input.value = '';
}
</script>
{{end}}
