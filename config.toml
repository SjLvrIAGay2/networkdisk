[server]
host = "0.0.0.0"
port = 24003
read_timeout = "30s"
write_timeout = "60s"
shutdown_timeout = "30s"

[database]
host = "127.0.0.1"
port = 3306
user = "networkdisk"
password = ""
database = "networkdisk"
max_open_conns = 25
max_idle_conns = 10
conn_max_lifetime = "5m"

[storage]
root = "/Volumes/.storage"
max_file_size = 524288000
thumbnail_max_size = 20971520
thumbnail_quality = 80

[upload]
allowed_extensions = []
blocked_extensions = [".exe", ".sh", ".bat", ".cmd", ".com", ".dll", ".so", ".dylib"]
detect_mime = true
on_name_conflict = "rename"

[auth]
jwt_secret = "dev-secret-do-not-use-in-production"
jwt_expire = "15m"
refresh_expire = "168h"
bcrypt_cost = 12

[log]
level = "debug"
format = "pattern"
file = "logs/log.log"

[share]
default_expire = ""
max_password_attempts = 5
